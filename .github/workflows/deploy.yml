# Builds the Vite site and publishes dist/ to GitHub Pages.
#
# Requires one manual setting in the repo:
#   Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
# (not "Deploy from a branch" — dist/ is gitignored and never committed).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main] # build-only validation; the deploy job is gated off below
  workflow_dispatch: # allows a manual re-run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; the newest push wins.
# keyed by ref so PR builds don't cancel the live deploy (or each other)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # packaging the artifact is only useful for a real deploy
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' # PRs validate the build only
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
